services:
  db:
    image: pgvector/pgvector:pg16
    container_name: tennis_db_container
    # No host port: only the backend needs the DB (it reaches it at db:5432).
    # Use `docker compose exec db psql -U postgres -d tennis_db` for a shell.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-tennis_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Creates the tables on first start (empty volume only).
      - ./app/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tennis_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: tennis_backend_container
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Built from the same variables, so passwords always match.
      # localhost -> db because inside Docker the host is the service name.
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tennis_db}
      CORS_ORIGINS: "http://localhost:3000,http://localhost:5173,http://localhost:8000"
      APP_ENV: production   # no SQL echo in the logs
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: